            <label for="taille"><i class="fas fa-ruler-vertical me-2"></i>Taille (cm)</label>
            <input type="number" id="taille" placeholder="Taille en cm" name="taille">
            <div id="error_taille" class="error-message"></div>
          </div>
          <div class="form-group col-md-6 input-container">
            <label for="poids"><i class="fas fa-weight-hanging me-2"></i>Poids (kg)</label>

          <label for="maladies_chroniques"><i class="fas fa-medkit me-2"></i>Maladies Chroniques</label>

          <div id="error_maladies_chroniques" class="error-message"></div>
        </div>

        <div class="form-group input-container">
            <label for="group_sanguin"><i class="fas fa-tint me-2"></i>Groupe Sanguin</label>
            <select id="group_sanguin" name="group_sanguin">
                <option value="" disabled selected hidden>Choisir un groupe sanguin</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            <div id="error_group_sanguin" class="error-message"></div>
          </div>

          <label for="info_supplementaires"><i class="fas fa-info-circle me-2"></i>Informations Supplémentaires</label>
          <input type="text" id="info_supplementaires" placeholder="Ajouter des informations supplémentaires" name="info">
          <div id="error_info_supplementaires" class="error-message"></div>
        </div>
