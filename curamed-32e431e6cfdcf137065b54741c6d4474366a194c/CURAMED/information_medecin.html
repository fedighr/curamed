      <form class="auth-form" method="POST" novalidate onsubmit="return verif();" action="info.php">

          <label for="specialite"><i class="fas fa-stethoscope me-2"></i>Spécialité</label>

            <option value="Dermatologie">Dermatologie</option>
            <option value="Pédiatrie">Pédiatrie</option>

        <div class="form-group input-container">
          <label for="adresse"><i class="fas fa-map-marker-alt me-2"></i>Adresse du Cabinet</label>

          <div id="error_adresse" class="error-message"></div>
        </div>

        <div class="form-group input-container">
          <label for="experience"><i class="fas fa-briefcase me-2"></i>Expérience</label>
          <input type="text" id="experience" placeholder="Nombre d'années d'expérience" name="experience">
          <div id="error_experience" class="error-message"></div>
        </div>
        
        <button type="submit" class="btn btn-success btn-auth">
          <i class="fas fa-save me-2"></i>Enregistrer
