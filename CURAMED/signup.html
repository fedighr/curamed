  <main class="auth-container">
    <div class="auth-card">
      <h1><i class="fas fa-user-plus me-2"></i>Inscription</h1>
      <p class="auth-subtitle">Créez votre compte</p>
      
      
      <form class="auth-form" method="POST" novalidate onsubmit="return verif();" action="signup.php">
        <div class="form-row">
          <div class="form-group col-md-6 input-container">
            <label for="prenom"><i class="fas fa-user me-2"></i>Prénom</label>
            <input type="text" id="prenom" placeholder="Prénom" name="prenom">
            <div id="error_prenom" class="error-message"></div>
          </div>
          <div class="form-group col-md-6 input-container">
            <label for="nom"><i class="fas fa-user me-2"></i>Nom</label>
            <input type="text" id="nom" placeholder="Nom" name="nom">
            <div id="error_nom" class="error-message"></div>
          </div>
        </div>

        <div class="form-group input-container" style="width: 100%;">
          <label for="age"><i class="fas fa-birthday-cake me-2"></i>Âge</label>
          <input type="number" id="age" placeholder="Âge" name="age">
          <div id="error_age" class="error-message"></div>
        </div>
        
        <div class="form-group input-container">
          <label for="email"><i class="fas fa-envelope me-2"></i>Email</label>
          <input type="email" id="email" placeholder="votre@email.com" name="email">
          <div id="error_email" class="error-message"></div>
        </div>
        
        <div class="form-group input-container">
          <label for="tel"><i class="fas fa-phone me-2"></i>Téléphone</label>
          <input type="tel" id="tel" placeholder="+216 00000000" name="tel">
          <div id="error_tel" class="error-message"></div>
        </div>
        
        <div class="form-group input-container">
          <label for="mdp"><i class="fas fa-lock me-2"></i>Mot de passe</label>
          <input type="password" id="mdp" placeholder="••••••••" name="mdp">
          <small class="form-text">Minimum 8 caractères avec chiffres et lettres</small>
          <div id="error_mdp" class="error-message"></div>
        </div>
        
        <div class="form-group input-container">
          <label for="c_mdp"><i class="fas fa-lock me-2"></i>Confirmer le mot de passe</label>
          <input type="password" id="c_mdp" placeholder="••••••••">
          <div id="error_c_mdp" class="error-message"></div>
        </div>
        
        
        <div class="form-group input-container">
          <label>Vous êtes :</label>
          <div class="form-check form-check-inline me-3">
            <input type="radio" id="patient" name="userType" value="patient" class="form-check-input">
            <label for="patient" class="form-check-label">Patient</label>
          </div>
          <div class="form-check form-check-inline">
            <input type="radio" id="medecin" name="userType" value="medecin" class="form-check-input">
            <label for="medecin" class="form-check-label">Médecin</label>
          </div>
          <div id="error_userType" class="error-message"></div>
        </div>
        
        
        <div class="form-check form-check-inline input-container">
          <input type="checkbox" id="terms" class="form-check-input">
          <label for="terms" class="form-check-label ms-2">
            J'accepte les <a href="#terms">conditions d'utilisation</a> et la <a href="#privacy">politique de confidentialité</a>
          </label>
          <div id="error_terms" class="error-message"></div>
        </div>
        
        <button type="submit" class="btn btn-success btn-auth">
          <i class="fas fa-user-plus me-2"></i>S'inscrire
        </button>
        
        <p class="auth-redirect">
          Déjà inscrit ? <a href="signup.html">Connectez-vous</a>
        </p>
