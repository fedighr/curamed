<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="image.png">
  <script src="C:\Isima\lcs2\scripts\app.js" defer></script>
</head>
<body>
  <div class="nav-overlay" onclick="toggleMenu()"></div>
  <header>
    <div class="d-flex align-items-center">
      <div class="menu-btn me-3" onclick="toggleMenu()" aria-label="Menu">
        <div class="bar"></div>
        <div class="bar"></div>

      <a href="sign in.html" class="btn btn-success">
        <i class="fas fa-sign-in-alt me-2"></i>Connexion

  <div class="side-nav">
    <span class="close-btn" onclick="toggleMenu()">×</span>

    <a href="#recherche"><i class="fas fa-search me-2"></i>Rechercher</a>
    <a href="#aide"><i class="fas fa-question-circle me-2"></i>Aide</a>
  </div>

  <main class="auth-container">
    <div class="auth-card">
      <h1><i class="fas fa-user-plus me-2"></i>Inscription</h1>
      <p class="auth-subtitle">Créez votre compte</p>
      
      <form class="auth-form">
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="firstname"><i class="fas fa-user me-2"></i>Prénom</label>
            <input type="text" id="firstname" placeholder="Prénom" required>
          </div>
          <div class="form-group col-md-6">
            <label for="lastname"><i class="fas fa-user me-2"></i>Nom</label>
            <input type="text" id="lastname" placeholder="Nom" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope me-2"></i>Email</label>
          <input type="email" id="email" placeholder="votre@email.com" required>
        </div>
        
        <div class="form-group">
          <label for="phone"><i class="fas fa-phone me-2"></i>Téléphone</label>
          <input type="tel" id="phone" placeholder="06 12 34 56 78">
        </div>
        
        <div class="form-group">
          <label for="password"><i class="fas fa-lock me-2"></i>Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
          <small class="form-text">Minimum 8 caractères avec chiffres et lettres</small>
        </div>
        
        <div class="form-group">
          <label for="confirm-password"><i class="fas fa-lock me-2"></i>Confirmer le mot de passe</label>
          <input type="password" id="confirm-password" placeholder="••••••••" required>
        </div>
        
        <!-- Boutons radio pour choisir le type d'utilisateur -->
        <div class="form-group">
          <div class="d-flex align-items-center">
            <label class="me-3">Vous êtes :</label>
            <div class="form-check form-check-inline me-3">
              <input type="radio" id="patient" name="userType" value="patient" class="form-check-input" checked>
              <label for="patient" class="form-check-label">Patient</label>
            </div>
            <div class="form-check form-check-inline">
              <input type="radio" id="medecin" name="userType" value="medecin" class="form-check-input">
              <label for="medecin" class="form-check-label">Médecin</label>
            </div>
          </div>
        </div>
        
        <!-- Checkbox pour les conditions -->
        <div class="form-check form-check-inline d-flex align-items-center">
          <input type="checkbox" id="terms" class="form-check-input" required>
          <label for="terms" class="form-check-label ms-2">
            J'accepte les <a href="#terms">conditions d'utilisation</a> et la <a href="#privacy">politique de confidentialité</a>
          </label>
        </div>
        
        <button type="submit" class="btn btn-success btn-auth">
          <i class="fas fa-user-plus me-2"></i>S'inscrire
        </button>
        
        <p class="auth-redirect">
          Déjà inscrit ? <a href="med4.html">Connectez-vous</a>
        </p>
      </form>
    </div>
  </main>

  <script>
    function toggleMenu() {
      const sideNav = document.querySelector('.side-nav');
      const overlay = document.querySelector('.nav-overlay');
      const menuBtn = document.querySelector('.menu-btn');
      
      sideNav.classList.toggle('show');
      overlay.classList.toggle('active');
      menuBtn.classList.toggle('active');
      
      document.body.style.overflow = sideNav.classList.contains('show') ? 'hidden' : 'auto';
    }
  </script>
