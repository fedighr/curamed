<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuraMed - Connexion</title>
  <link rel="stylesheet" href="styles/main.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logo.png">
  <script src="scripts/signin.js" defer></script>
  <script src="scripts/app.js" defer></script>
</head>
<body>
  <div class="nav-overlay" onclick="toggleMenu()"></div>
  <header>
    <div class="d-flex align-items-center">
      <div class="menu-btn me-3" onclick="toggleMenu()" aria-label="Menu">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <a href="index.html" class="logo-link">
        <img src="images/logo.png" class="img-fluid" alt="CuraMed">
      </a>
    </div>
    <nav>
      <a href="signup.html" class="btn btn-outline-success">
        <i class="fas fa-user-plus me-2"></i>S'inscrire
      </a>
    </nav>
  </header>

  <div class="side-nav">
    <span class="close-btn" onclick="toggleMenu()">×</span>
    <a href="home.html"><i class="fas fa-home me-2"></i>Accueil</a>
    <a href="booking.html"><i class="fas fa-search me-2"></i>Rechercher</a>
    <a href="#aide"><i class="fas fa-question-circle me-2"></i>Aide</a>
  </div>

  <main class="auth-container">
    <div class="auth-card">
      <h1><i class="fas fa-sign-in-alt me-2"></i>Connexion</h1>
      <p class="auth-subtitle">Accédez à votre espace patient</p>
      
      <form class="auth-form" id="loginForm" method="POST" action="login.php">
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope me-2"></i>Email</label>
          <input type="email" id="email" name="text" placeholder="votre@email.com" required>
          <small id="emailError" class="form-text text-danger"></small>
        </div>
        
        <div class="form-group">
          <label for="password"><i class="fas fa-lock me-2"></i>Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <small id="passwordError" class="form-text text-danger"></small>
          <a href="#forgot-password" class="forgot-password">Mot de passe oublié ?</a>
        </div>
        
        <button type="submit" class="btn btn-success btn-auth">
          <i class="fas fa-sign-in-alt me-2"></i>Se connecter
        </button>
        
        <div class="auth-divider">
          <span>ou</span>
        </div>
        
        <button type="button" class="btn btn-outline-primary btn-social">
          <i class="fab fa-google me-2"></i>Continuer avec Google
        </button>
        
        <p class="auth-redirect">
          Nouveau patient ? <a href="signup.html">Créez un compte</a>
        </p>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>© 2025 CuraMed. Tous droits réservés.</p>
      <div class="social-icons">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
